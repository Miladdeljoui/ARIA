<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ARIA humanoid assistant concept</title>
  <desc id="desc">A futuristic, non-human humanoid AI assistant silhouette with a dark glass face and violet, cyan, and magenta luminous contours, displayed as a concept direction for the ARIA project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b18"/><stop offset=".55" stop-color="#17102f"/><stop offset="1" stop-color="#071d2a"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#b52dff" stop-opacity=".45"/><stop offset="1" stop-color="#6a20ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff65ef"/><stop offset=".48" stop-color="#9d5bff"/><stop offset="1" stop-color="#4df4ff"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202440"/><stop offset=".5" stop-color="#090d1c"/><stop offset="1" stop-color="#302044"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#8f77d6" stroke-opacity=".1" stroke-width="1"/></pattern>
  </defs>
