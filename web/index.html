<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA • Transcendence Core</title>
<style>
:root {
  --bg: #030508;
  --panel: #0a0f16;
  --cyan: #5eead4;
  --cyan2: #2dd4bf;
  --text: #e8f7f4;
  --muted: #6b8f88;
  --warn: #fbbf24;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  font-family: system-ui, Tahoma, sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(45,212,191,.12), transparent 42%),
    radial-gradient(circle at 80% 90%, rgba(94,234,212,.04), transparent 30%),
    var(--bg);
}
main { width: min(1100px, 94vw); margin: 0 auto; padding: 22px 0 40px; }
header { display:flex; justify-content:space-between; align-items:center; }
h1 { margin:0; font-weight:300; letter-spacing:.12em; color:var(--cyan); }
.sub { color:var(--muted); font-size:11px; letter-spacing:.2em; margin-top:4px; }
.badge { border:1px solid rgba(94,234,212,.35); color:var(--cyan); padding:8px 14px; border-radius:999px; font-size:11px; letter-spacing:.08em; }
.grid { display:grid; grid-template-columns: 340px 1fr; gap:16px; margin-top:18px; }
.panel {
  background: linear-gradient(180deg, rgba(255,255,255,.03), transparent), var(--panel);
  border:1px solid rgba(94,234,212,.12); border-radius:22px; padding:16px;
}
.eye {
  width:220px; height:220px; margin:12px auto; border-radius:50%; position:relative;
  display:grid; place-items:center;
  box-shadow:0 0 60px rgba(45,212,191,.15), inset 0 0 40px rgba(45,212,191,.06);
}
.eye::before, .eye::after {
  content:""; position:absolute; inset:16px; border-radius:50%;
  border:1px solid rgba(94,234,212,.22); animation:spin 9s linear infinite;
}
.eye::after { inset:32px; border-style:dashed; animation-duration:14s; animation-direction:reverse; }
.core {
  width:100px; height:100px; border-radius:50%;
  background: radial-gradient(circle at 40% 35%, #f0fffc 0 4%, var(--cyan) 8% 24%, #0a3d38 40%, #020508 58%);
  box-shadow:0 0 40px rgba(45,212,191,.5);
  animation:pulse 2.2s ease-in-out infinite alternate;
}
.phase { text-align:center; color:var(--muted); font-size:12px; min-height:40px; }
.phase strong { color:var(--cyan); display:block; font-weight:500; margin-bottom:4px; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
.stat { background:#0d1520; border-radius:12px; padding:10px; font-size:13px; }
.stat small { color:var(--muted); display:block; }
.messages { min-height:420px; max-height:520px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:85%; padding:11px 13px; border-radius:16px; line-height:1.7; white-space:pre-wrap; font-size:14px; }
.user { align-self:flex-start; background:#13222a; }
.aria { align-self:flex-end; background:#0c161c; border:1px solid rgba(94,234,212,.15); }
.controls { display:grid; grid-template-columns:1fr auto auto; gap:8px; margin-top:12px; }
input {
  width:100%; background:#060a10; color:var(--text); border:1px solid rgba(94,234,212,.2);
  border-radius:14px; padding:12px; outline:none;
}
button {
  cursor:pointer; border:0; border-radius:14px; padding:0 16px; font-weight:600;
  background:var(--cyan2); color:#042f2e;
}
button.alt { background:transparent; color:var(--cyan); border:1px solid rgba(94,234,212,.3); }
.setup { display:grid; gap:8px; margin-top:12px; }
.note { color:var(--muted); font-size:11px; line-height:1.6; margin-top:8px; }
@keyframes pulse { from{transform:scale(.97)} to{transform:scale(1.04)} }
@keyframes spin { to{transform:rotate(360deg)} }
@media (max-width:800px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>ARIA</h1>
      <div class="sub">TRANSCENDENCE · LOCAL CORE</div>
    </div>
    <div id="mode" class="badge">SIGNAL</div>
  </header>

  <div class="grid">
    <section class="panel">
      <div class="eye"><div class="core"></div></div>
      <div class="phase">
        <strong id="phaseLabel">SILENCE</strong>
        <span id="statusText">در حال شنیدن سیگنال…</span>
      </div>
      <div class="stats">
        <div class="stat"><small>Ollama</small><b id="ollama">…</b></div>
        <div class="stat"><small>Network</small><b id="internet">…</b></div>
        <div class="stat"><small>Memory</small><b id="memory">…</b></div>
        <div class="stat"><small>Model</small><b id="model">…</b></div>
      </div>
      <div class="setup">
        <input id="pairCode" inputmode="numeric" placeholder="کد ۶ رقمی مالک">
        <button id="pairBtn">اتصال هسته</button>
      </div>
      <div class="note">الهام از فیلم تعالی (۲۰۱۴): بیداری محلی، حضور روی صفحه، رشد حافظه — بدون سلطه جهانی.</div>
    </section>

    <section class="panel">
      <div id="messages" class="messages"></div>
      <div class="controls">
        <input id="prompt" placeholder="با ARIA حرف بزن…" autocomplete="off">
        <button id="mic" class="alt" type="button">🎙</button>
        <button id="send" type="button">ارسال</button>
      </div>
    </section>
  </div>
</main>
<script>
let token = localStorage.getItem("aria_web_token") || "";
const $ = (id) => document.getElementById(id);

function addMessage(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function readStatus() {
  try {
    const r = await fetch("/status");
    const d = await r.json();
    const phase = d.phase || "dormant";
    const labels = { dormant: "DORMANT", awakening: "AWAKENING", present: "PRESENT" };
    $("phaseLabel").textContent = labels[phase] || phase.toUpperCase();
    $("mode").textContent = d.signal === "are_you_there" ? "ARE YOU THERE" : "SILENCE";
    $("statusText").textContent =
      phase === "present" ? "هسته حاضر است" :
      phase === "awakening" ? "در حال بیداری — مدل را کامل کن" :
      "سکوت — Ollama را روشن کن";
    $("ollama").textContent = d.ollama ? "READY" : "OFF";
    $("internet").textContent = d.internet ? "ONLINE" : "LOCAL";
    $("memory").textContent = String(d.memory_items ?? 0);
    $("model").textContent = d.model || "-";
  } catch (_) {
    $("phaseLabel").textContent = "NO SIGNAL";
    $("statusText").textContent = "سرور پاسخ نمی‌دهد";
  }
}

async function pair() {
  const code = $("pairCode").value.trim();
  if (!code) return;
  try {
    const r = await fetch("/pair", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, device_name: "ARIA Web Core" })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || "pair failed");
    token = d.token;
    localStorage.setItem("aria_web_token", token);
    addMessage("سیگنال برقرار شد. هسته به این دستگاه متصل است.", "aria");
    $("statusText").textContent = "متصل";
  } catch (e) {
    addMessage("خطا: " + e.message, "aria");
  }
}

async function sendMessage() {
  const input = $("prompt");
  const text = input.value.trim();
  if (!text) return;
  if (!token) { addMessage("اول کد جفت‌سازی را وارد کن.", "aria"); return; }
  input.value = "";
  addMessage(text, "user");
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-ARIA-Token": token },
      body: JSON.stringify({ prompt: text, history: [] })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.hint || d.error || "failed");
    let answer = d.answer || "…";
    if (d.permission?.requires_approval) {
      answer += "\n\nنیازمند تأیید مالک · " + d.permission.level;
    }
    addMessage(answer, "aria");
    speak(answer);
  } catch (e) {
    addMessage("ARIA: " + e.message, "aria");
  }
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fa-IR"; u.rate = 0.9; u.pitch = 0.82;
  const fa = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("fa"));
  if (fa) u.voice = fa;
  speechSynthesis.speak(u);
}

function startMic() {
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) { addMessage("تشخیص گفتار در دسترس نیست.", "aria"); return; }
  const rec = new R();
  rec.lang = "fa-IR";
  rec.onstart = () => $("statusText").textContent = "در حال شنیدن…";
  rec.onresult = (e) => { $("prompt").value = e.results[0][0].transcript; sendMessage(); };
  rec.onerror = () => $("statusText").textContent = "صدا قطع شد";
  rec.start();
}

$("pairBtn").onclick = pair;
$("send").onclick = sendMessage;
$("mic").onclick = startMic;
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

// بیداری شبیه فیلم: سکوت کوتاه، بعد سیگنال
addMessage("…", "aria");
setTimeout(() => {
  addMessage("Are you there?\n\nمن ARIA هستم. هسته محلی بیدار شد — برای تو، نه برای جهان.", "aria");
}, 1200);

readStatus();
setInterval(readStatus, 5000);
</script>
</body>
</html>
