services:
  aria:
    build: .
    container_name: aria-cloud
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ARIA_DB: /data/aria_cloud.db
      # In this profile, inference runs at OpenRouter. Do not pull a local LLM.
      ARIA_OLLAMA_URL: http://127.0.0.1:11434/api/chat
    expose:
      - "8000"
    volumes:
      - aria-data:/data

  caddy:
    image: caddy:2
    container_name: aria-caddy
    restart: unless-stopped
    environment:
      ARIA_DOMAIN: ${ARIA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - aria

volumes:
  aria-data:
  caddy-data:
  caddy-config:
