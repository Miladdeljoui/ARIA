name: ARIA Cloud Tests

on:
  push:
    branches: [main, master]
    paths:
      - "cloud/**"
      - "tests/**"
      - ".github/workflows/cloud-tests.yml"
  pull_request:
    paths:
      - "cloud/**"
      - "tests/**"
      - ".github/workflows/cloud-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cloud/requirements.txt pytest httpx
      - name: Compile Python
        run: python -m compileall -q cloud tests
      - name: Run cloud tests
        run: pytest -q
