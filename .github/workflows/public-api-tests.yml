name: ARIA Public API Tests

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/public-api-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/public-api-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARIA_PUBLIC_DB: /tmp/aria-public-tests.sqlite3
      ARIA_SESSION_SECRET: test-only-secret-that-is-long-enough-for-tests
      ARIA_GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
      ARIA_COOKIE_SECURE: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Run public store tests
        run: python -m unittest discover -s server/tests -p "test_*.py" -v
